name: Build Executable

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller openpyxl

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name "BukuKasKelompok" --clean kas_kelompok.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BukuKasKelompok-Windows
          path: dist/BukuKasKelompok.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller openpyxl

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name "BukuKasKelompok" --clean kas_kelompok.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BukuKasKelompok-Linux
          path: dist/BukuKasKelompok
          retention-days: 30

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: BukuKasKelompok-Windows
          path: ./windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: BukuKasKelompok-Linux
          path: ./linux

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows/BukuKasKelompok.exe
            linux/BukuKasKelompok
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
